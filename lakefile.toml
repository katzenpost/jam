name = "jam"
version = "0.2.0"
description = "A Lean TUI group chat over the Katzenpost mixnet that speaks katzenqt's group chat"
keywords = ["chat", "tui", "mixnet", "katzenpost", "privacy"]
license = "AGPL-3.0-only"
defaultTargets = ["jam"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "Tessera"
git = "https://github.com/katzenpost/tessera.git"
rev = "90796b7d89f0165535c1398e51787f171ffef535"

[[require]]
name = "Logger"
git = "https://github.com/katzenpost/Logger.git"
rev = "v0.2.0"

[[require]]
name = "thinclient"
git = "https://github.com/katzenpost/thin_client.git"
rev = "98ff985ad348156eccbe7d3f4c4849a47041f2d3"

# Pinned here to the head of its main, a merge of the commit thin_client pins.
[[require]]
name = "lean_unix_socket"
git = "https://github.com/katzenpost/lean_unix_socket.git"
rev = "v0.1.0"

# Declared last so that it is the Cryptlib Lake resolves, ahead of thin_client's older pin.
[[require]]
name = "group_chat_client"
git = "https://github.com/katzenpost/group_chat_client.git"
rev = "001196f63f168f5fe82703584d934be682ea8b2f"

[[require]]
name = "cryptlib"
git = "https://github.com/katzenpost/cryptlib.git"
rev = "6d8c31e81fc187f24c80257f5a96689d3ba0fc5e"

# The voucher drawn as a QR code, as hushphone, the T-Deck and katzenqt draw it.
[[require]]
name = "qrcode"
git = "https://github.com/katzenpost/qrcode-lean.git"
rev = "ba0231d23ce193d7230cfdb0d5e9eb81e27f5cf2"

[[lean_lib]]
name = "Jam"

[[lean_exe]]
name = "jam"
root = "Jam.Main"

[[lean_exe]]
name = "jam-test"
root = "Jam.Tests.Main"

[[lean_exe]]
name = "jam-integration"
root = "Jam.Tests.Integration"

[[lean_exe]]
name = "jam-interop"
root = "Jam.Tests.Interop"
