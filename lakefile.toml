name = "jam"
version = "0.2.0"
description = "A Lean TUI group chat over the Katzenpost mixnet that speaks katzenqt's group chat"
keywords = ["chat", "tui", "mixnet", "katzenpost", "privacy"]
license = "AGPL-3.0-only"
defaultTargets = ["jam"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "Tessera"
git = "https://github.com/katzenpost/tessera.git"
rev = "v0.2.0"

[[require]]
name = "Logger"
git = "https://github.com/katzenpost/Logger.git"
rev = "v0.2.0"

[[require]]
name = "thinclient"
git = "https://github.com/katzenpost/thin_client.git"
rev = "985dc6a9188efad36ccdb020547b73fb7d43b23f"

# Pinned here to the head of its main, a merge of the commit thin_client pins.
[[require]]
name = "lean_unix_socket"
git = "https://github.com/katzenpost/lean_unix_socket.git"
rev = "v0.1.0"

# Declared last so that it is the Cryptlib Lake resolves, ahead of thin_client's older pin.
[[require]]
name = "group_chat_client"
git = "https://github.com/katzenpost/group_chat_client.git"
rev = "v0.2.0"

[[require]]
name = "cryptlib"
git = "https://github.com/katzenpost/cryptlib.git"
rev = "v0.2.0"

[[lean_lib]]
name = "Jam"

[[lean_exe]]
name = "jam"
root = "Jam.Main"

[[lean_exe]]
name = "jam-test"
root = "Jam.Tests.Main"

[[lean_exe]]
name = "jam-integration"
root = "Jam.Tests.Integration"

[[lean_exe]]
name = "jam-interop"
root = "Jam.Tests.Interop"
