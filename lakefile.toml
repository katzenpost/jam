name = "jam"
defaultTargets = ["jam"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "Tessera"
git = "https://github.com/katzenpost/Tessera.git"
rev = "d9e207d4b20a516915bde85757cce32535a33daf"

[[require]]
name = "Logger"
git = "https://github.com/katzenpost/Logger.git"
rev = "61f4fc02ffa00401d59d98f25feda499f26b10e2"

[[require]]
name = "thinclient"
git = "https://github.com/katzenpost/thin_client.git"
rev = "bb6d1aa6573d7b67cacda61cf533302974a41497"

# Pinned here to the head of its main, a merge of the commit thin_client pins.
[[require]]
name = "lean_unix_socket"
git = "https://github.com/katzenpost/lean_unix_socket.git"
rev = "4bbfd6bb9df6bc9ce0d31252afff86d48683c9f2"

# Declared last so that it is the CryptWalker Lake resolves, ahead of thin_client's older pin.
[[require]]
name = "group_chat_client"
git = "https://github.com/katzenpost/group_chat_client.git"
rev = "14656d428ba2f6079239f7301cd6fb03289e9795"

[[require]]
name = "CryptWalker"
git = "https://github.com/katzenpost/CryptWalker.git"
rev = "4831c416b8552e8829f77bfc9e5710fece5379c8"

[[lean_lib]]
name = "Jam"

[[lean_exe]]
name = "jam"
root = "Jam.Main"

[[lean_exe]]
name = "jam-test"
root = "Jam.Tests.Main"

[[lean_exe]]
name = "jam-integration"
root = "Jam.Tests.Integration"

[[lean_exe]]
name = "jam-interop"
root = "Jam.Tests.Interop"
